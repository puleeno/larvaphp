[workspace]
resolver = "2"
members = [
    "crates/larva-php",
    "crates/larva-php-sys",
    "crates/larva-php-caddy",
    "crates/larva-php-extgen",
    "crates/larva-php-panel",
]

[workspace.package]
version = "1.13.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/larva-php/larva-php"
authors = ["LarvaPHP contributors"]

[workspace.dependencies]
larva-php = { path = "crates/larva-php" }
larva-php-sys = { path = "crates/larva-php-sys" }
larva-php-caddy = { path = "crates/larva-php-caddy" }
larva-php-extgen = { path = "crates/larva-php-extgen" }
larva-php-panel = { path = "crates/larva-php-panel" }

tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http-body = "0.4"
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam = "0.8"
dashmap = "6"
arc-swap = "1"
once_cell = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
regex = "1"
walkdir = "2"
glob = "0.3"
memmap2 = "0.9"
num_cpus = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }