    C106 110, 93 126, 72 126
    H58
    V156
    C58 174, 46 184, 34 184
    C24 184, 20 172, 20 156
    Z"/>
  <!-- Minimalist twin pill eyes (#0F172A) -->
  <rect x="30" y="72" width="9" height="19" rx="4.5" fill="#0F172A"/>
  <rect x="43" y="72" width="9" height="19" rx="4.5" fill="#0F172A"/>

  <!-- CENTER "H": Diagonally Split Amber-Gold & PHP-Purple Bridge -->
  <!-- Left Gold Pillar + Left Half Crossbar -->
  <path fill="#F59E0B" d="
    M116 56 C116 50, 120 46, 126 46 H134 C140 46, 144 50, 144 56
    V102 H158 L144 126 V174 C144 180, 140 184, 134 184 H126
    C120 184, 116 180, 116 174 Z"/>
