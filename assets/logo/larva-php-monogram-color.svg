<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <title>LarvaPHP - PHP Mascot Monogram (Larva + Purple ElePHPant)</title>
  <defs>
    <mask id="php-larva-p-mask">
      <rect width="320" height="200" fill="#ffffff"/>
      <!-- P inner bowl counter -->
      <path d="M58 76 H70 C77 76, 82 81, 82 88 C82 95, 77 100, 70 100 H58 Z" fill="#000000"/>
      <!-- Two clean diagonal negative-space tail stripes -->
      <polygon points="16,172 60,126 70,126 26,172" fill="#000000"/>
      <polygon points="28,186 72,140 82,140 38,186" fill="#000000"/>
    </mask>
    <mask id="php-elephant-p-mask">
      <rect width="320" height="200" fill="#ffffff"/>
      <!-- Elephant eye -->
      <circle cx="256" cy="84" r="5" fill="#000000"/>
      <!-- Crisp P-bowl counter / chin notch separating stem and trunk -->
      <path d="M238 122 C248 118, 258 124, 260 134 C252 138, 242 136, 238 130 Z" fill="#000000"/>
    </mask>
  </defs>

  <!-- LEFT "P": Amber-Gold Larva (#F59E0B) -->
