<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <title>LarvaPHP Mascot Mark - Larva x Purple ElePHPant (2-Color)</title>
  <defs>
    <mask id="fused-larva-cuts">
      <rect width="256" height="256" fill="#ffffff"/>
      <!-- Two diagonal negative-space stripes on larva tail -->
      <polygon points="82,164 118,124 130,124 94,164" fill="#000000"/>
      <polygon points="103,168 139,128 151,128 115,168" fill="#000000"/>
    </mask>
    <mask id="fused-elephant-eye">
      <rect width="256" height="256" fill="#ffffff"/>
      <circle cx="176" cy="122" r="5.5" fill="#000000"/>
    </mask>
  </defs>

  <g transform="translate(-10, 4)">
