# Install with: sudo cp larva-php-tmpfiles.conf /etc/tmpfiles.d/larva-php.conf
# Then: sudo systemd-tmpfiles --create /etc/tmpfiles.d/larva-php.conf

d /run/larva-php        0755 www-data www-data -
d /var/log/larva-php    0755 www-data www-data -
d /var/lib/larva-php    0755 www-data www-data -
d /var/lib/larva-php/tls 0700 www-data www-data -
d /var/lib/larva-php/acme 0700 www-data www-data -
