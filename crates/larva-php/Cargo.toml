[package]
name = "larva-php"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "LarvaPHP - a modern PHP application server written in Rust, based on FrankenPHP"

[dependencies]
larva-php-sys = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http-body = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
once_cell = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
tokio-util = { version = "0.7", optional = true }
notify = { version = "6", optional = true, features = ["default"] }
quiche = { version = "0.30", optional = true }
rcgen = { version = "0.13", optional = true }
reqwest = { version = "0.13", optional = true, features = ["json"] }
base64 = { version = "0.22", optional = true }
memmap2 = { workspace = true }
num_cpus = { workspace = true }

[features]
default = ["mercure", "watcher", "fcgi"]
mercure = []
watcher = ["notify", "tokio-util"]
hotreload = ["mercure", "watcher"]
http3 = ["quiche", "rcgen"]
fcgi = []
embedded = []
acme = ["reqwest", "base64"]

[[bin]]
name = "larva-php"
path = "src/main.rs"