# Build configuration for LarvaPHP.
#
# Windows: statically link the C runtime so the binary is self-contained and
# does not depend on external CRT DLLs (vcruntime140.dll, ucrtbase.dll).
#
# Linux/macOS: no forced static linking. `+crt-static` is an MSVC concept; on
# Linux it also breaks host proc-macro artifacts (e.g. clap_derive). Platform
# selection lives in `crates/larva-php-sys/build/platform.rs`.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# If you need a dynamically-linked debug build on Windows, override with:
#   RUSTFLAGS="" cargo build
#   cargo build --config 'target.x86_64-pc-windows-msvc.rustflags=[]'

# For a fully static Linux binary (no glibc), use the musl target instead:
#   rustup target add x86_64-unknown-linux-musl
#   cargo build --release --target x86_64-unknown-linux-musl -p larva-php
